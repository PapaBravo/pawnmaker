<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pawnmaker</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>pawnmaker</h1>
    <p>Quickly generate printable pawns for your tabletop session.</p>
  </header>

  <main>
    <section id="pawn-form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a pawn</h2>
      <form id="pawn-form">
        <p>
          <label for="pawn-name">Name</label>
          <input id="pawn-name" name="name" type="text" required maxlength="50"
                 placeholder="e.g. Goblin">
        </p>

        <p>
          <span id="image-label">Image</span>
          <span id="drop-zone" role="button" tabindex="0" aria-labelledby="image-label">
            <span id="drop-text">Click to choose an image or drop one here</span>
            <img id="image-preview" alt="" hidden>
            <input id="pawn-image" name="image" type="file" accept="image/*"
                   required hidden>
          </span>
        </p>

        <p>
          <label for="pawn-size">Size</label>
          <select id="pawn-size" name="size">
            <option value="small">Small (2.9 &times; 2.9 cm)</option>
            <option value="medium" selected>Medium (2.9 &times; 4.9 cm)</option>
            <option value="large">Large (4.9 &times; 6.4 cm)</option>
            <option value="huge">Huge (7.6 &times; 9.9 cm)</option>
          </select>
        </p>

        <p>
          <label for="pawn-count">Count</label>
          <input id="pawn-count" name="count" type="number" value="1" min="1"
                 max="99" required>
        </p>

        <p>
          <button type="submit">Add pawn</button>
        </p>
      </form>
    </section>

    <section id="pawn-list-section" aria-labelledby="list-heading">
      <h2 id="list-heading">Your pawns</h2>
      <p id="empty-message">No pawns yet. Add your first pawn above.</p>
      <ul id="pawn-controls"></ul>
      <p>
        <button id="print-button" type="button" disabled>Print</button>
      </p>
      <div id="sheet" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
